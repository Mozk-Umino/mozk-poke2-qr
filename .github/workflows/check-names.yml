name: 日本語名チェック

# 週1回、日本語名が未登録・推測・読みの食い違いのカードがないか調べて Issue にする。
# どちらもなくなったら Issue を閉じる。
on:
  schedule:
    - cron: "17 0 * * 1" # 毎週月曜 9:17（日本時間）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "ja-names.js"
      - "scripts/**"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: テスト
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 未登録・推測・読みの食い違いを調べる
        id: check
        run: |
          pip install --quiet pykakasi
          node scripts/check-names.mjs --out missing.md | tee result.txt
          python3 scripts/check-readings.py --out readings.md | tee -a result.txt
          missing=$(grep '^MISSING=' result.txt | tail -1 | cut -d= -f2)
          mismatch=$(grep '^MISMATCH=' result.txt | tail -1 | cut -d= -f2)
          echo "missing=$((missing + mismatch))" >> "$GITHUB_OUTPUT"
          cat missing.md readings.md > body.md
      - name: Issue を作る・更新する・閉じる
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING: ${{ steps.check.outputs.missing }}
        run: |
          title="日本語名の未登録・推測カード"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$MISSING" -gt 0 ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file body.md
            else
              gh issue create --title "$title" --body-file body.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "すべてのカードに確認済みの日本語名が登録されました。"
          fi
