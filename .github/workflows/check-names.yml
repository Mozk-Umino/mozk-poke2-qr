name: 日本語名チェック

# 週1回、カードDBに日本語名が未登録のカードがないか調べて Issue にする。
# 未登録がなくなったら Issue を閉じる。
on:
  schedule:
    - cron: "17 0 * * 1" # 毎週月曜 9:17（日本時間）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "ja-names.js"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: テスト
        run: npm test
      - name: 未登録のカードを調べる
        id: check
        run: |
          node scripts/check-names.mjs --out missing.md | tee result.txt
          grep '^MISSING=' result.txt | tail -1 | sed 's/MISSING/missing/' >> "$GITHUB_OUTPUT"
      - name: Issue を作る・更新する・閉じる
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING: ${{ steps.check.outputs.missing }}
        run: |
          title="日本語名が未登録のカードがあります"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$MISSING" -gt 0 ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file missing.md
            else
              gh issue create --title "$title" --body-file missing.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "すべてのカードに日本語名が登録されました。"
          fi
