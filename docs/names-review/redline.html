2", "heading": true, "chars": 80}, {"id": "Frost_Rotom", "cat": "ai", "md": "### Frost Rotom\n\n- 日本語名: **フロストロトム（exが付く場合は末尾にex）**\n- 読み（カード画像のファイル名）: `FROST ROTOM`\n- 収録: A2-48", "heading": true, "chars": 83}, {"id": "Hearthflame_Mask_Ogerpon", "cat": "ai", "md": "### Hearthflame Mask Ogerpon\n\n- 日本語名: **オーガポン かまどのめん（exが付く場合は末尾にex）**\n- 読み（カード画像のファイル名）: `OGERPONKAMADONOMEN`\n- 収録: B2-27, B4b-51, B4b-272", "heading": true, "chars": 122}, {"id": "Heat_Rotom", "cat": "ai", "md": "### Heat Rotom\n\n- 日本語名: **ヒートロトム（exが付く場合は末尾にex）**\n- 読み（カード画像のファイル名）: `HEAT ROTOM`\n- 収録: A2-30", "heading": true, "chars": 80}, {"id": "Mow_Rotom", "cat": "ai", "md": "### Mow Rotom\n\n- 日本語名: **カットロトム（exが付く場合は末尾にex）**\n- 読み（カード画像のファイル名）: `CUT ROTOM`\n- 収録: A2-21", "heading": true, "chars": 78}, {"id": "Rapid_Strike_Urshifu", "cat": "ai", "md": "### Rapid Strike Urshifu\n\n- 日本語名: **れんげきウーラオス（exが付く場合は末尾にex）**\n- 読み（カード画像のファイル名）: `WULAOSURENGEKINOKATA`\n- 収録: B3-51", "heading": true, "chars": 103}, {"id": "Single_Strike_Urshifu", "cat": "ai", "md": "### Single Strike Urshifu\n\n- 日本語名: **いちげきウーラオス（exが付く場合は末尾にex）**\n- 読み（カード画像のファイル名）: `WULAOSUICHIGEKINOKATA`\n- 収録: B3-113", "heading": true, "chars": 106}, {"id": "Teal_Mask_Ogerpon", "cat": "ai", "md": "### Teal Mask Ogerpon\n\n- 日本語名: **オーガポン みどりのめん（exが付く場合は末尾にex）**\n- 読み（カード画像のファイル名）: `OGERPONMIDORINOMEN`\n- 収録: B4b-27, B4b-257", "heading": true, "chars": 109}, {"id": "Teal_MaskOgerpon", "cat": "ai", "md": "### Teal MaskOgerpon\n\n- 日本語名: **オーガポン みどりのめん（exが付く場合は末尾にex）**\n- 読み（カード画像のファイル名）: `OGERPONMIDORINOMEN`\n- 収録: B4-19", "heading": true, "chars": 100}, {"id": "Ultra_Necrozma", "cat": "ai", "md": "### Ultra Necrozma\n\n- 日本語名: **ウルトラネクロズマ（exが付く場合は末尾にex）**\n- 読み（カード画像のファイル名）: `?`\n- 収録: -", "heading": true, "chars": 75}, {"id": "Wash_Rotom", "cat": "ai", "md": "### Wash Rotom\n\n- 日本語名: **ウォッシュロトム（exが付く場合は末尾にex）**\n- 読み（カード画像のファイル名）: `WASH ROTOM`\n- 収録: A2-47", "heading": true, "chars": 82}, {"id": "Wellspring_Mask_Ogerpon", "cat": "ai", "md": "### Wellspring Mask Ogerpon\n\n- 日本語名: **オーガポン いどのめん（exが付く場合は末尾にex）**\n- 読み（カード画像のファイル名）: `OGERPONIDONOMEN`\n- 収録: B2-48", "heading": true, "chars": 102}]};
const CATS=[["you","私が書いた"],["edit","赤入れで直した"],["rw","会話の指示で直した"],["src","一次情報"],["ai","AIが考えた"]];
const QAS=[["aiish","AIっぽい"],["cut","削る"],["short","短く"],["weak","弱い"],["fact","事実が怪しい"],["mine","自分で書く"]];
const LBL=Object.fromEntries(QAS);
let DOCID=Object.keys(DATA)[0]||"doc";
let blocks=[], ids=new Set(), threads={}, allThreads={}, db=null, open=null, drafts={};
const off=new Set();
const $=i=>document.getElementById(i);
const sideOf=id=>document.querySelector(`[data-side="${id}"]`);
const blkOf=id=>document.querySelector(`.row[data-id="${id}"] .blk`);
const lastIsMozk=e=>Array.isArray(e)&&e.length&&e[e.length-1].who==="mozk";

try{drafts=JSON.parse(localStorage.getItem("redline-drafts")||"{}")}catch(e){drafts={}}
const saveDrafts=()=>{try{localStorage.setItem("redline-drafts",JSON.stringify(drafts))}catch(e){}};

CATS.forEach(([c,label])=>{
 const b=document.createElement("button");
 b.className="key";b.type="button";b.setAttribute("aria-pressed","true");
 b.innerHTML=`<span class="sw" style="background:var(--${c})"></span>${label} <span class="n" id="n-${c}"></span>`;
 b.onclick=()=>{off.has(c)?off.delete(c):off.add(c);b.setAttribute("aria-pressed",String(!off.has(c)));dim();};
 $("legend").insertBefore(b,$("status"));
});

function buildTabs(){
 const names=Object.keys(DATA);
 $("tabs").hidden=names.length<2;
 $("tabs").innerHTML="";
 names.forEach(n=>{
  const t=document.createElement("button");t.className="tab";t.type="button";
  t.setAttribute("aria-selected",String(n===DOCID));
  t.appendChild(document.createTextNode(n));
  const w=document.createElement("span");w.className="w";w.dataset.wait=n;t.appendChild(w);
  t.onclick=()=>{
   if(n===DOCID)return;
   DOCID=n;
   [...$("tabs").children].forEach(c=>c.setAttribute("aria-selected",String(c===t)));
   syncThreads();buildRows();
  };
  $("tabs").appendChild(t);
 });
}

function buildRows(){
 blocks=DATA[DOCID]||[];ids=new Set(blocks.map(b=>b.id));
 rows.innerHTML="";open=null;
 blocks.forEach(b=>{
  const row=document.createElement("div");row.className="row";row.dataset.id=b.id;
  const el=document.createElement("div");
  el.className="blk"+(b.heading?" head":"")+((b.md.startsWith("|")||b.md.startsWith("```"))?" pre":"");
  el.dataset.c=b.cat;
  el.innerHTML=`<span class="bid">${b.id}</span><span class="rounds" data-rounds="${b.id}"></span>`;
  el.appendChild(document.createTextNode(b.md.replace(/^#+\s*/,"")));
  el.onclick=()=>{open=(open===b.id)?null:b.id;draw();};
  const side=document.createElement("div");side.className="side";side.dataset.side=b.id;
  row.append(el,side);rows.appendChild(row);
 });
 ratio();dim();draw();
}
const rows=$("rows");

function ratio(){
 const t={},total=blocks.reduce((a,b)=>a+b.chars,0)||1;
 blocks.forEach(b=>t[b.cat]=(t[b.cat]||0)+b.chars);
 $("ratio").innerHTML="";
 CATS.forEach(([c,label])=>{
  const pct=(t[c]||0)/total*100;
  const s=document.createElement("span");s.style.width=pct+"%";s.style.background=`var(--${c})`;
  s.title=`${label} ${pct.toFixed(0)}%`;$("ratio").appendChild(s);
  $("n-"+c).textContent=Math.round(pct)+"%";
 });
}
function dim(){document.querySelectorAll(".blk").forEach(e=>e.classList.toggle("dim",off.has(e.dataset.c)));}
function syncThreads(){
 threads={};
 Object.entries(allThreads).forEach(([k,v])=>{
  if(k.startsWith(DOCID+"__")) threads[k.slice(DOCID.length+2)]=v;});
}
function tabWaits(){
 Object.keys(DATA).forEach(n=>{
  const el=document.querySelector(`[data-wait="${n}"]`);if(!el)return;
  const own=new Set(DATA[n].map(b=>b.id));
  const w=Object.entries(allThreads).filter(([k,v])=>{
   const i=k.indexOf("__");
   return k.slice(0,i)===n && own.has(k.slice(i+2)) && lastIsMozk(v);}).length;
  el.textContent=w?String(w):"";
 });
}

function entryEl(e){
 const d=document.createElement("div");d.className="entry "+(e.who==="mozk"?"mozk":"claude");
 const w=document.createElement("span");w.className="who";
 w.textContent=e.who==="mozk"?"赤入れ":"直した";d.appendChild(w);
 if(e.action&&LBL[e.action]){const c=document.createElement("span");c.className="chip";
  c.textContent=LBL[e.action];d.appendChild(c);}
 if(e.text){const p=document.createElement("p");p.className="etext";p.textContent=e.text;d.appendChild(p);}
 return d;
}

function buildPad(b,side){
 const dk=DOCID+"__"+b.id;
 const dr=drafts[dk]||{action:"",text:""};
 const pad=document.createElement("div");pad.className="pad";
 pad.addEventListener("click",e=>e.stopPropagation());
 const qas=document.createElement("div");qas.className="qas";
 const ta=document.createElement("textarea");
 ta.id="ta-"+dk;ta.placeholder="どこがどう気になるか（任意）";ta.value=dr.text;
 ta.oninput=()=>{drafts[dk]={action:(drafts[dk]||{}).action||"",text:ta.value};saveDrafts();};
 QAS.forEach(([k,label])=>{
  const q=document.createElement("button");q.className="qa";q.type="button";q.textContent=label;q.dataset.k=k;
  q.setAttribute("aria-pressed",String(dr.action===k));
  q.onclick=()=>{
   const cur=(drafts[dk]||{}).action||"";
   const action=(cur===k)?"":k;
   drafts[dk]={action,text:ta.value};saveDrafts();
   qas.querySelectorAll(".qa").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.k===action)));
  };
  qas.appendChild(q);
 });
 const act=document.createElement("div");act.className="act";
 const s=document.createElement("button");s.className="send";s.type="button";s.textContent="赤を入れる";
 s.onclick=async()=>{
  const d=drafts[dk]||{action:"",text:""};const text=ta.value.trim();
  if(!d.action&&!text){open=null;draw();return;}
  s.disabled=true;
  await append(b.id,{who:"mozk",kind:"note",action:d.action||"",text,at:Date.now()});
  delete drafts[dk];saveDrafts();open=null;draw();
 };
 const c=document.createElement("button");c.className="send ghost";c.type="button";c.textContent="やめる";
 c.onclick=()=>{delete drafts[dk];saveDrafts();open=null;draw();};
 const h=document.createElement("span");h.className="hint";h.textContent=b.id;
 act.append(s,c,h);pad.append(qas,ta,act);side.appendChild(pad);
 ta.focus();
}

function drawBlock(b){
 const side=sideOf(b.id);if(!side)return;
 const es=threads[b.id]||[];
 const el=blkOf(b.id);
 el.classList.toggle("waiting",lastIsMozk(es));
 el.classList.toggle("open",open===b.id);
 const r=el.querySelector(`[data-rounds="${b.id}"]`);
 const n=es.filter(e=>e.who==="mozk").length;
 r.textContent=n?`赤${n}`:"";
 if(open===b.id && side.querySelector("textarea")) return;
 side.onclick=null;side.innerHTML="";side.className="side";
 es.forEach(e=>side.appendChild(entryEl(e)));
 if(open===b.id){buildPad(b,side);return;}
 const add=document.createElement("div");
 add.className="side empty";
 add.style.padding=es.length?"0":"9px 0 0";
 add.textContent=es.length?"＋ さらに赤を入れる":"＋ 赤を入れる";
 add.onclick=()=>{open=b.id;draw();};
 side.appendChild(add);
}
function draw(){blocks.forEach(drawBlock);drawGone();tabWaits();}

function drawGone(){
 const orphans=Object.keys(threads).filter(id=>!ids.has(id)).sort();
 $("goneWrap").hidden=!orphans.length;
 const box=$("gone");box.innerHTML="";
 orphans.forEach(id=>{
  const d=document.createElement("div");d.className="gone";
  const h=document.createElement("h3");h.textContent=id+"（削除済み）";d.appendChild(h);
  (threads[id]||[]).forEach(e=>d.appendChild(entryEl(e)));
  box.appendChild(d);
 });
}

async function append(id,entry){
 if(!db){$("status").textContent="保存できません（この画面では未接続）";return;}
 const key=DOCID+"__"+id;
 const cur=(threads[id]||[]).slice();cur.push(entry);
 threads[id]=cur;allThreads[key]=cur;
 try{
  await db.doc(`threads/${key}`).set({entries:cur});
  $("status").textContent="赤を入れました";
 }catch(e){
  $("status").textContent=(e&&e.code==="invalid_argument")?"書き込み権限がありません":"保存に失敗しました";
  cur.pop();threads[id]=cur;allThreads[key]=cur;draw();
 }
}

buildTabs();buildRows();
(async()=>{
 db=await claude.use("db");
 if(!db){$("status").textContent="読み取り専用（赤は保存されません）";return;}
 $("status").textContent="接続済み";
 db.collection("threads").onSnapshot(s=>{
  const next={};
  s.docs.forEach(d=>{
   const v=d.data()||{};
   next[d.id]=Array.isArray(v.entries)?v.entries:[];
  });
  allThreads=next;syncThreads();draw();
 },e=>{$("status").textContent="同期が切れました（再読み込みしてください）";});
})();
</script>
